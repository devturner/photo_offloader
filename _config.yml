# GitHub Pages turns the Markdown pages into the project website, using _layouts/default.html.
title: Photo Offloader
description: Safely import camera cards to your Mac and a USB drive, with an optional Google Photos upload.

# Pages only copies these two as raw Markdown unless they are listed here.
include:
  - README.md
  - CONTRIBUTING.md

defaults:
  - scope:
      path: README.md
    values:
      title: Get started
      permalink: /get-started.html
  # Published because the README links to them, or because Pages publishes every
  # HTML file, but not pages for people searching: leave them out of sitemap.xml.
  - scope:
      path: CLAUDE.md
    values:
      sitemap: false
  - scope:
      path: CODE_QUALITY.md
    values:
      sitemap: false
  - scope:
      path: photo_offloader
    values:
      sitemap: false

# Writes sitemap.xml, so search engines find every page. GitHub Pages supports this plugin.
plugins:
  - jekyll-sitemap
