name: Coverage

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coverage:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-ui.txt

      # No Chromium: the browser tests exercise the page's JavaScript and add no Python
      # coverage. They run in tests.yml.
      - name: Run tests under coverage
        run: python -m coverage run -m unittest discover

      - name: Combine the data files
        run: python -m coverage combine

      - name: Build the HTML report
        run: python -m coverage html --fail-under=0

      - name: Keep the HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov

      - name: Check the minimum
        run: python -m coverage report
