name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install menu-bar UI dependencies
        run: python -m pip install -r requirements-ui.txt

      - name: Run tests
        run: python -m unittest discover -v

      - name: Run Ruff
        run: python -m ruff check .

      - name: Validate shell scripts
        run: bash -n install.sh uninstall.sh scripts/*.sh tools/*.sh

      - name: Compile Python modules
        run: python -m compileall -q photo_offloader tools && python -m py_compile bin/*
