name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install menu-bar UI dependencies
        run: python -m pip install -r requirements-ui.txt

      - name: Run tests
        run: python -m unittest discover -v

      - name: Run Ruff
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Validate shell scripts
        run: bash -n install.sh uninstall.sh scripts/*.sh tools/*.sh

      - name: Compile Python modules
        run: python -m compileall -q photo_offloader tools && python -m py_compile bin/*

  browser:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Run the dashboard page tests
        run: python -m unittest tests.browser.test_dashboard_page -v
        env:
          PHOTO_OFFLOADER_REQUIRE_BROWSER: "1"
          PHOTO_OFFLOADER_TEST_SCREENSHOTS: ${{ runner.temp }}/dashboard-screenshots

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: ${{ runner.temp }}/dashboard-screenshots
