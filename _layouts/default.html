<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="icon" type="image/png" href="{{ '/assets/app-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <main>
    <header class="site-header"><a href="{{ '/' | relative_url }}"><img class="app-icon" src="{{ '/assets/app-icon.png' | relative_url }}" alt="" width="22" height="22">{{ site.title }}</a></header>
    <article>
{{ content }}
    </article>
    <footer class="site-footer"><a href="https://github.com/devturner/photo_offloader">Source on GitHub</a></footer>
  </main>
</body>
</html>
